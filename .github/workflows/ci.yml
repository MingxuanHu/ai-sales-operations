name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate documentation scaffold
        run: node scripts/check-docs.mjs
  application:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      # Each matrix entry becomes a job. Let every check finish if another fails.
      fail-fast: false
      matrix:
        check: [lint, typecheck, unit-tests, integration-tests, build]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        # Node reads the package manager name and version from the workspace manifest.
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      # The integration test starts and removes its own PostgreSQL Compose service.
      - name: Run ${{ matrix.check }}
        run: pnpm run ${{ matrix.check }}
