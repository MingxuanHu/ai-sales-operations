name: Check demo AWS identity

# Run only after separately authorized IAM setup and developer review on main.
on:
  workflow_dispatch:

permissions: {}

jobs:
  identity:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: demo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # This permits requesting a JWT, not publishing artifacts or changing IAM.
      id-token: write
    steps:
      - name: Inspect expected claims without logging the token
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          // Inspect claims in memory. AWS verifies the signature in the next step.
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
          url.searchParams.set('audience', 'sts.amazonaws.com')
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          })
          if (!response.ok) throw new Error('OIDC request failed')
          const { value } = await response.json()
          if (typeof value !== 'string') throw new Error('OIDC response has no token')
          const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString())
          // Fixed error messages avoid including claim contents in assertion output.
          const valid = claims.iss === 'https://token.actions.githubusercontent.com' &&
            claims.aud === 'sts.amazonaws.com' &&
            claims.sub === 'repo:MingxuanHu@20830158/ai-sales-operations@1452171772:environment:demo' &&
            claims.ref === 'refs/heads/main' && claims.environment === 'demo' &&
            claims.repository_id === '1452171772' && claims.repository_owner_id === '20830158'
          assert.ok(valid, 'Unexpected OIDC claims; stop before requesting AWS credentials')
          console.log('Expected OIDC claims verified')
          NODE
      - name: Obtain short-lived demo credentials
        # v6.3.0; pin the reviewed action so a moved tag cannot change its code.
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.DEMO_RELEASE_ROLE_ARN }}
          aws-region: ap-southeast-2
          allowed-account-ids: '381491963300'
          role-duration-seconds: 900
          role-session-name: demo-identity-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Verify the assumed role without releasing code
        shell: bash
        run: |
          # Select only the role ARN, never credentials or the OIDC token.
          role_arn=$(aws sts get-caller-identity --query Arn --output text)
          case "$role_arn" in
            arn:aws:sts::381491963300:assumed-role/SalesOperationsDemoRelease/demo-identity-*)
              echo 'Expected demo AWS role verified' ;;
            *) echo 'Unexpected AWS role' >&2; exit 1 ;;
          esac
