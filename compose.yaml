# Compose runs PostgreSQL while pnpm runs the web and API on the host.
services:
  salesOpDb:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: sales_operations
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - sales_operations_postgres_data:/var/lib/postgresql
    healthcheck:
      # Wait for TCP so the temporary initialization server cannot pass this check.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "demo", "-d", "sales_operations"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  sales_operations_postgres_data:
    # An explicit name keeps Compose from prefixing the volume with the project name.
    name: sales_operations_postgres_data
