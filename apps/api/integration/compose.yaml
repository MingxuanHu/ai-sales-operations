services:
  salesOpDb:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: readiness
    ports:
      # An omitted host port lets Docker allocate one for each test run.
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "test", "-d", "readiness"]
      interval: 1s
      timeout: 3s
      retries: 30
